<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AR.js Marker MVP</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
      }

      body {
        position: fixed;
        inset: 0;
      }

      video,
      #arjs-video,
      canvas,
      .a-canvas,
      a-scene {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: auto !important;
        bottom: auto !important;
        width: 100vw !important;
        width: 100dvw !important;
        height: 100vh !important;
        height: 100dvh !important;
        min-width: 100vw !important;
        min-height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        transform: none !important;
      }

      video,
      #arjs-video {
        object-fit: cover !important;
        z-index: 0 !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      canvas,
      .a-canvas,
      a-scene {
        z-index: 1 !important;
        background: transparent !important;
        background-color: transparent !important;
      }

      .a-canvas {
        pointer-events: none;
      }

      .hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 3;
        padding: 10px 12px;
        border-radius: 8px;
        color: #fff;
        background: rgba(0, 0, 0, 0.68);
        font-size: 14px;
        line-height: 1.4;
        pointer-events: none;
      }

      .hud strong {
        display: block;
        font-size: 15px;
      }

      .debug {
        display: block;
        margin-top: 3px;
        color: #f1d27a;
        font-size: 12px;
      }
    </style>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('fit-ar-layers', {
        init: function () {
          var scene = this.el;
          var important = function (el, name, value) {
            el.style.setProperty(name, value, 'important');
          };
          var viewport = function () {
            var visual = window.visualViewport;
            return {
              width: Math.ceil((visual && visual.width) || window.innerWidth || document.documentElement.clientWidth),
              height: Math.ceil((visual && visual.height) || window.innerHeight || document.documentElement.clientHeight)
            };
          };
          var fitBox = function (el, size, zIndex) {
            important(el, 'position', 'fixed');
            important(el, 'top', '0px');
            important(el, 'left', '0px');
            important(el, 'right', 'auto');
            important(el, 'bottom', 'auto');
            important(el, 'width', size.width + 'px');
            important(el, 'height', size.height + 'px');
            important(el, 'min-width', size.width + 'px');
            important(el, 'min-height', size.height + 'px');
            important(el, 'max-width', 'none');
            important(el, 'max-height', 'none');
            important(el, 'margin', '0');
            important(el, 'transform', 'none');
            important(el, 'z-index', zIndex);
          };
          var fit = function () {
            var size = viewport();
            document.documentElement.style.width = size.width + 'px';
            document.documentElement.style.height = size.height + 'px';
            document.body.style.width = size.width + 'px';
            document.body.style.height = size.height + 'px';

            document.querySelectorAll('video, #arjs-video').forEach(function (video) {
              video.setAttribute('playsinline', '');
              video.setAttribute('webkit-playsinline', '');
              fitBox(video, size, '0');
              important(video, 'object-fit', 'cover');
              important(video, 'visibility', 'visible');
              important(video, 'opacity', '1');

              if (video.parentElement && video.parentElement !== document.body) {
                fitBox(video.parentElement, size, '0');
                important(video.parentElement, 'overflow', 'hidden');
              }
            });

            [scene, scene.canvas].concat(Array.prototype.slice.call(document.querySelectorAll('canvas, .a-canvas'))).forEach(function (canvas) {
              if (!canvas) return;
              fitBox(canvas, size, '1');
              important(canvas, 'background', 'transparent');
              important(canvas, 'background-color', 'transparent');
            });

            if (scene.renderer) {
              scene.renderer.setClearColor(0x000000, 0);
              scene.renderer.setClearAlpha(0);
              scene.renderer.setSize(size.width, size.height, false);
            }
          };

          scene.addEventListener('loaded', fit);
          scene.addEventListener('render-target-loaded', fit);
          window.addEventListener('resize', fit);
          window.addEventListener('orientationchange', function () {
            window.setTimeout(fit, 250);
            window.setTimeout(fit, 900);
          });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fit);
            window.visualViewport.addEventListener('scroll', fit);
          }

          var observer = new MutationObserver(fit);
          observer.observe(document.body, { attributes: true, childList: true, subtree: true });

          var started = Date.now();
          var tick = function () {
            fit();
            if (Date.now() - started < 120000) {
              window.requestAnimationFrame(tick);
            }
          };
          tick();
        }
      });

      AFRAME.registerComponent('ar-status', {
        init: function () {
          var status = document.getElementById('status-line');
          var scene = this.el;
          var update = function (message) {
            if (status) status.textContent = message;
          };

          scene.addEventListener('camera-init', function () {
            update('Camera initialized. Point at the Hiro marker.');
          });
          scene.addEventListener('camera-error', function () {
            update('Camera error. Reset site camera permission or try Chrome.');
          });

          var marker = document.querySelector('a-marker');
          marker.addEventListener('markerFound', function () {
            update('Marker found. Duck should be visible.');
          });
          marker.addEventListener('markerLost', function () {
            update('Camera active. Looking for Hiro marker...');
          });

          var started = Date.now();
          var timer = window.setInterval(function () {
            var video = document.querySelector('video, #arjs-video');
            if (video && (video.srcObject || video.videoWidth > 0 || video.readyState > 0)) {
              update('Camera active. Looking for Hiro marker...');
              window.clearInterval(timer);
            } else if (Date.now() - started > 15000) {
              update('No camera feed detected. Check site camera permission or try Chrome.');
              window.clearInterval(timer);
            }
          }, 500);
        }
      });
    </script>
  </head>
  <body>
    <div class="hud">
      <strong>AR.js marker test</strong>
      Allow camera access, then point at the Hiro marker.
      <span id="status-line" class="debug">Waiting for camera permission...</span>
    </div>

    <a-scene
      embedded
      fit-ar-layers
      ar-status
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="antialias: true; alpha: true; precision: mediump"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
      <a-assets timeout="10000">
        <a-asset-item
          id="duck-model"
          src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb"
        ></a-asset-item>
      </a-assets>

      <a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <a-cylinder color="#35d07f" radius="0.35" height="0.06" position="0 0 0" opacity="0.85"></a-cylinder>
        <a-entity
          gltf-model="#duck-model"
          position="0 0.1 0"
          rotation="-90 0 0"
          scale="0.014 0.014 0.014"
          animation="property: rotation; to: -90 360 0; loop: true; dur: 5000; easing: linear"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
