<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AR.js Marker MVP</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
      }

      video,
      #arjs-video,
      .a-canvas,
      a-scene {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        width: 100dvw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
      }

      video,
      #arjs-video {
        object-fit: cover !important;
        z-index: 0 !important;
        transform: none !important;
      }

      .a-canvas,
      a-scene {
        z-index: 1 !important;
        background: transparent !important;
      }

      .a-canvas {
        pointer-events: none;
      }

      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background: #050505;
        text-align: center;
      }

      .start-panel {
        max-width: 360px;
      }

      .start-panel h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 700;
      }

      .start-panel p {
        margin: 0 0 18px;
        color: #cfcfcf;
        font-size: 15px;
        line-height: 1.45;
      }

      .start-panel button {
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 8px;
        color: #07130c;
        background: #35d07f;
        font: inherit;
        font-weight: 700;
      }

      .start-panel button:disabled {
        opacity: 0.65;
      }

      .start-panel .status {
        min-height: 20px;
        margin-top: 12px;
        color: #f1d27a;
        font-size: 13px;
        line-height: 1.35;
      }

      .hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 3;
        padding: 10px 12px;
        border-radius: 8px;
        color: #fff;
        background: rgba(0, 0, 0, 0.68);
        font-size: 14px;
        line-height: 1.4;
        pointer-events: none;
      }

      .hud strong {
        display: block;
        font-size: 15px;
      }
    </style>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('fit-ar-layers', {
        init: function () {
          var scene = this.el;
          var important = function (el, name, value) {
            el.style.setProperty(name, value, 'important');
          };
          var viewport = function () {
            var visual = window.visualViewport;
            return {
              width: Math.ceil((visual && visual.width) || window.innerWidth || document.documentElement.clientWidth),
              height: Math.ceil((visual && visual.height) || window.innerHeight || document.documentElement.clientHeight)
            };
          };
          var fitBox = function (el, size, zIndex) {
            important(el, 'position', 'fixed');
            important(el, 'top', '0');
            important(el, 'left', '0');
            important(el, 'right', 'auto');
            important(el, 'bottom', 'auto');
            important(el, 'width', size.width + 'px');
            important(el, 'height', size.height + 'px');
            important(el, 'min-width', size.width + 'px');
            important(el, 'min-height', size.height + 'px');
            important(el, 'max-width', 'none');
            important(el, 'max-height', 'none');
            important(el, 'margin', '0');
            important(el, 'z-index', zIndex);
          };
          var fit = function () {
            var size = viewport();
            document.documentElement.style.setProperty('--app-width', size.width + 'px');
            document.documentElement.style.setProperty('--app-height', size.height + 'px');

            document.querySelectorAll('video, #arjs-video').forEach(function (video) {
              video.setAttribute('playsinline', '');
              video.setAttribute('webkit-playsinline', '');
              fitBox(video, size, '0');
              important(video, 'object-fit', 'cover');
              important(video, 'transform', 'none');
              important(video, 'visibility', 'visible');
              important(video, 'opacity', '1');

              if (video.parentElement && video.parentElement !== document.body) {
                fitBox(video.parentElement, size, '0');
                important(video.parentElement, 'overflow', 'hidden');
              }
            });

            [scene, scene.canvas, document.querySelector('.a-canvas')].forEach(function (canvas) {
              if (!canvas) return;
              fitBox(canvas, size, '1');
              important(canvas, 'background', 'transparent');
            });

            if (scene.renderer) {
              scene.renderer.setClearColor(0x000000, 0);
              scene.renderer.setClearAlpha(0);
              scene.renderer.setSize(size.width, size.height, false);
            }
          };

          scene.addEventListener('loaded', fit);
          scene.addEventListener('render-target-loaded', fit);
          window.addEventListener('resize', fit);
          window.addEventListener('orientationchange', function () {
            window.setTimeout(fit, 250);
            window.setTimeout(fit, 800);
          });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fit);
            window.visualViewport.addEventListener('scroll', fit);
          }

          var observer = new MutationObserver(fit);
          observer.observe(document.body, { attributes: true, childList: true, subtree: true });

          var start = Date.now();
          var tick = function () {
            fit();
            if (Date.now() - start < 120000) {
              window.requestAnimationFrame(tick);
            }
          };
          tick();
        }
      });

      var requestCameraOnce = async function () {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('This browser does not expose the camera API on this page.');
        }

        var stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' } }
        });
        stream.getTracks().forEach(function (track) {
          track.stop();
        });
      };

      var createScene = function () {
        var root = document.getElementById('ar-root');
        root.innerHTML = '';

        var scene = document.createElement('a-scene');
        scene.setAttribute('embedded', '');
        scene.setAttribute('fit-ar-layers', '');
        scene.setAttribute('vr-mode-ui', 'enabled: false');
        scene.setAttribute('renderer', 'antialias: true; alpha: true; precision: mediump');
        scene.setAttribute('arjs', 'sourceType: webcam; trackingMethod: best; debugUIEnabled: false;');
        scene.innerHTML = '\
          <a-assets timeout="10000">\
            <a-asset-item id="duck-model" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb"></a-asset-item>\
          </a-assets>\
          <a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">\
            <a-cylinder color="#35d07f" radius="0.35" height="0.06" position="0 0 0" opacity="0.85"></a-cylinder>\
            <a-entity gltf-model="#duck-model" position="0 0.1 0" rotation="-90 0 0" scale="0.014 0.014 0.014" animation="property: rotation; to: -90 360 0; loop: true; dur: 5000; easing: linear"></a-entity>\
          </a-marker>\
          <a-entity camera></a-entity>';
        root.appendChild(scene);
        return scene;
      };

      window.addEventListener('DOMContentLoaded', function () {
        var start = document.getElementById('start-ar');
        var screen = document.getElementById('start-screen');
        var status = document.getElementById('start-status');
        start.addEventListener('click', async function () {
          start.disabled = true;
          status.textContent = 'Requesting camera permission...';

          try {
            await requestCameraOnce();
            status.textContent = 'Starting AR camera...';
            createScene();
            window.setTimeout(function () {
              screen.style.display = 'none';
            }, 1200);
          } catch (error) {
            start.disabled = false;
            status.textContent = 'Camera did not start: ' + (error && error.message ? error.message : error);
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="start-screen" class="start-screen">
      <div class="start-panel">
        <h1>AR.js Marker MVP</h1>
        <p>Tap start, allow camera access, then point at the Hiro marker.</p>
        <button id="start-ar" type="button">Start Camera</button>
        <div id="start-status" class="status"></div>
      </div>
    </div>

    <div class="hud">
      <strong>AR.js marker test</strong>
      Point at the Hiro marker. If tracking works, a duck and green base appear on the marker.
    </div>

    <div id="ar-root"></div>
  </body>
</html>
